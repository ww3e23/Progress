name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-functions.yml
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Auth Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          elif [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::请到 Progress Secrets 新增 FIREBASE_SERVICE_ACCOUNT（Firebase 服务帐户 JSON）。"
            exit 1
          fi
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function deps
        working-directory: functions
        run: npm ci || npm install
      - name: Build functions
        working-directory: functions
        run: npm run build
      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use site-progress-app-8d6c2
          firebase deploy --only functions --non-interactive --project site-progress-app-8d6c2
