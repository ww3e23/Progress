name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /Progress/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # 若有設 GitHub Secret 會覆寫；未設則用 .env.production 內的 Client ID
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          # 空的 GitHub Secret 會蓋掉 .env.production；未填就 unset，改用檔案裡的進度專案設定
          for k in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_GOOGLE_OAUTH_CLIENT_ID; do
            eval "v=\${$k}"
            if [ -z "$v" ]; then unset "$k"; fi
          done
          set -a
          # shellcheck disable=SC1091
          [ -f .env.production ] && . ./.env.production
          set +a
          echo "Firebase config presence (values hidden):"
          for k in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            eval "v=\${$k}"
            if [ -z "$v" ]; then echo "$k=EMPTY"; else echo "$k=SET"; fi
          done
          echo "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}"
          if [ "$VITE_FIREBASE_PROJECT_ID" = "ci-inspection" ]; then
            echo "::error::Progress 禁止使用 ci-inspection Firebase。請改用獨立專案 site-progress-app-8d6c2。"
            exit 1
          fi
          if [ "$VITE_FIREBASE_PROJECT_ID" != "site-progress-app-8d6c2" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID 必須是 site-progress-app-8d6c2（目前：${VITE_FIREBASE_PROJECT_ID:-empty}）"
            exit 1
          fi
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "::error::缺少 Firebase 網頁設定，無法建置正式站。"
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
