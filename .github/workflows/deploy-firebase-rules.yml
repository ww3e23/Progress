name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-rules.yml
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Progress 仓库缺少 FIREBASE_TOKEN，无法把规则发布到 site-progress-app-8d6c2。"
            echo "请把 ww3e23/CI 同一个 FIREBASE_TOKEN 复制到 https://github.com/ww3e23/Progress/settings/secrets/actions"
            echo "或本机执行 firebase login:ci 后把 token 加进去，再重新跑此 workflow。"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore & Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use site-progress-app-8d6c2
          firebase deploy --only firestore:rules,storage --non-interactive
